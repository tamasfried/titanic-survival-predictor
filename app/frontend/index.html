<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Titanic Survival Predictor</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
  }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.9rem; }
  input, select {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    box-sizing: border-box;
    font-size: 1rem;
  }
  button {
    margin-top: 20px;
    padding: 10px 16px;
    font-size: 1rem;
    cursor: pointer;
  }
  #result {
    margin-top: 20px;
    padding: 12px;
    border-radius: 6px;
    font-size: 1.05rem;
    display: none;
  }
  #result.survived { background: #e6f4ea; color: #1e4620; display: block; }
  #result.died { background: #fce8e6; color: #611a15; display: block; }
  #result.error { background: #fce8e6; color: #611a15; display: block; }
</style>
</head>
<body>

<h1>Titanic Survival Predictor</h1>
<p>Enter passenger details to see what the model predicts.</p>

<form id="predict-form">
  <label for="pclass">Ticket class</label>
  <select id="pclass" required>
    <option value="1">1st class</option>
    <option value="2">2nd class</option>
    <option value="3" selected>3rd class</option>
  </select>

  <label for="sex">Sex</label>
  <select id="sex" required>
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>

  <label for="age">Age</label>
  <input type="number" id="age" min="0" max="120" step="1" value="30" required>

  <label for="fare">Fare paid (£)</label>
  <input type="number" id="fare" min="0" step="0.01" value="15" required>

  <label for="sibsp">Siblings / spouses aboard</label>
  <input type="number" id="sibsp" min="0" step="1" value="0" required>

  <label for="parch">Parents / children aboard</label>
  <input type="number" id="parch" min="0" step="1" value="0" required>

  <label for="embarked">Port of embarkation</label>
  <select id="embarked" required>
    <option value="S" selected>Southampton</option>
    <option value="C">Cherbourg</option>
    <option value="Q">Queenstown</option>
  </select>

  <button type="submit">Predict</button>
</form>

<div id="result"></div>

<script>
  // Change this if your backend runs somewhere other than localhost:8000.
  const API_URL = "http://localhost:8000/predict";

  const form = document.getElementById("predict-form");
  const resultDiv = document.getElementById("result");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const payload = {
      pclass: parseInt(document.getElementById("pclass").value, 10),
      sex: document.getElementById("sex").value,
      age: parseFloat(document.getElementById("age").value),
      fare: parseFloat(document.getElementById("fare").value),
      sibsp: parseInt(document.getElementById("sibsp").value, 10),
      parch: parseInt(document.getElementById("parch").value, 10),
      embarked: document.getElementById("embarked").value,
    };

    resultDiv.className = "";
    resultDiv.style.display = "none";
    resultDiv.textContent = "Predicting...";
    resultDiv.style.display = "block";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        const errorBody = await response.json().catch(() => ({}));
        throw new Error(errorBody.detail || `Request failed (${response.status})`);
      }

      const data = await response.json();
      const percent = Math.round(data.probability * 100);

      if (data.survived) {
        resultDiv.className = "survived";
        resultDiv.textContent = `This passenger would likely have survived — ${percent}% confidence.`;
      } else {
        resultDiv.className = "died";
        resultDiv.textContent = `This passenger would likely NOT have survived — ${100 - percent}% confidence.`;
      }
    } catch (err) {
      resultDiv.className = "error";
      resultDiv.textContent = `Something went wrong: ${err.message}. Is the backend running at ${API_URL}?`;
    }
  });
</script>

</body>
</html>
